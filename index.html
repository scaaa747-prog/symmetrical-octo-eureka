<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFC Movies Stream Player</title>
    <meta name="description" content="Custom HLS Stream Player for OFC Movies with real-time MP4 downloader.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css?v=ofc_v18">
</head>
<body>
    <div class="app-viewport">
        <!-- Main Player Container -->
        <div id="player-container" class="player-container">
            <!-- Loading Overlay -->
            <div id="player-loading" class="player-overlay loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">
                    <span>Decrypting OFC Movies M3U8 Stream...</span>
                    <p>Executing XOR-PRNG cipher...</p>
                </div>
            </div>

            <!-- Error Overlay -->
            <div id="player-error" class="player-overlay error-overlay hidden">
                <i class="fa-solid fa-triangle-exclamation error-icon"></i>
                <h3>Stream Resolution Failed</h3>
                <p id="error-message">Could not fetch valid stream sources for this media ID.</p>
                <button class="btn-primary" onclick="resolveAndPlay()">
                    <i class="fa-solid fa-rotate-right"></i> Retry Search
                </button>
            </div>

            <!-- Top Header Bar Overlay (Transparent Glass) -->
            <div id="top-header-bar" class="top-header-bar glass-overlay">
                <div class="header-left">
                    <h2 id="media-title" class="media-title">OFC Movies Stream</h2>
                </div>
                <div class="header-right">
                    <!-- Season / Episode Selector for TV Shows & Anime -->
                    <div id="tv-controls-group" class="tv-controls-group hidden">
                        <div class="glass-dropdown header-dropdown">
                            <i class="fa-solid fa-list-ol ctrl-icon"></i>
                            <select id="season-select" onchange="handleSeasonChange(this.value)" title="Season">
                                <option value="1">Season 1</option>
                            </select>
                        </div>
                        <div class="glass-dropdown header-dropdown">
                            <i class="fa-solid fa-tv ctrl-icon"></i>
                            <select id="episode-select" onchange="handleEpisodeChange(this.value)" title="Episode">
                                <option value="1">Episode 1</option>
                            </select>
                        </div>
                    </div>


                    <span id="media-info-badge" class="info-badge"><i class="fa-solid fa-film"></i> OFC Movies</span>
                </div>
            </div>

            <!-- Double-Tap / Skip Feedback Animation Indicators -->
            <!-- HTML5 Video Player -->
            <video id="video-player" class="video-element" crossorigin="anonymous" playsinline preload="auto"></video>

            <!-- CUSTOM TRANSPARENT PLAYER CONTROLS OVERLAY -->
            <div id="custom-controls" class="custom-controls-bar glass-controls">
                <!-- Interactive Timeline / Progress Bar -->
                <div id="progress-container" class="progress-container" onclick="seekVideo(event)" onmousemove="updateProgressTooltip(event)" onmouseleave="hideProgressTooltip()">
                    <!-- Hover Tooltip -->
                    <div id="progress-tooltip" class="progress-tooltip">00:00</div>
                    <div class="progress-bar-bg">
                        <div id="buffer-fill" class="buffer-fill"></div>
                        <div id="progress-fill" class="progress-fill"></div>
                        <div id="progress-scrubber" class="progress-scrubber"></div>
                    </div>
                </div>

                <!-- Controls Bottom Row -->
                <div class="controls-row">
                    <!-- Left Controls: Play/Pause, Time Display -->
                    <div class="controls-group left-group">
                        <button id="play-pause-btn" class="ctrl-btn glass-icon-btn" onclick="togglePlay()" title="Play/Pause (Space)">
                            <i class="fa-solid fa-play"></i>
                        </button>

                        <div class="time-display glass-badge">
                            <span id="current-time">00:00</span>
                            <span class="time-divider">/</span>
                            <span id="duration-time">00:00</span>
                        </div>
                    </div>

                    <!-- Center Controls: Quality, Audio, Subtitles, Speed -->
                    <div class="controls-group center-group">
                        <!-- Video Quality Selector -->
                        <div class="dropdown-wrapper glass-dropdown">
                            <i class="fa-solid fa-gear ctrl-icon"></i>
                            <select id="quality-select" onchange="changeQuality(this.value)" title="Video Quality">
                                <option value="-1">Auto Quality</option>
                            </select>
                        </div>

                        <!-- Audio Language Selector -->
                        <div class="dropdown-wrapper glass-dropdown">
                            <i class="fa-solid fa-language ctrl-icon"></i>
                            <select id="audio-select" onchange="changeAudioTrack(this.value)" title="Audio Language">
                                <option value="-1">Default Audio</option>
                            </select>
                        </div>

                        <!-- Subtitles Selector -->
                        <div class="dropdown-wrapper glass-dropdown">
                            <i class="fa-solid fa-closed-captioning ctrl-icon"></i>
                            <select id="subtitle-select" onchange="changeSubtitle(this.value)" title="Subtitles">
                                <option value="-1">Subtitles Off</option>
                            </select>
                        </div>

                        <!-- Playback Speed Selector -->
                        <div class="dropdown-wrapper glass-dropdown">
                            <i class="fa-solid fa-gauge-high ctrl-icon"></i>
                            <select id="speed-select" onchange="changeSpeed(this.value)" title="Playback Speed">
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1" selected>1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2.0x</option>
                            </select>
                        </div>
                    </div>

                    <!-- Right Controls: Download, Volume, Picture-in-Picture, Fullscreen -->
                    <div class="controls-group right-group">
                        <!-- Volume Control -->
                        <div class="volume-container glass-badge">
                            <button id="mute-btn" class="ctrl-btn glass-icon-btn inner-btn" onclick="toggleMute()" title="Mute/Unmute (M)">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
                        </div>

                        <!-- Direct Fast MP4 Download Button -->
                        <button id="download-btn" class="btn-download-action glass-download-btn" onclick="triggerDownload()" title="Download MP4 Video">
                            <i class="fa-solid fa-download"></i>
                            <span>Download MP4</span>
                        </button>

                        <!-- Picture in Picture -->
                        <button id="pip-btn" class="ctrl-btn glass-icon-btn" onclick="togglePiP()" title="Picture in Picture (P)">
                            <i class="fa-solid fa-clone"></i>
                        </button>

                        <!-- Fullscreen Toggle -->
                        <button id="fullscreen-btn" class="ctrl-btn glass-icon-btn" onclick="toggleFullscreen()" title="Fullscreen (F)">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
    </div>

    <script src="/app.js?v=ofc_v18"></script>
</body>
</html>
